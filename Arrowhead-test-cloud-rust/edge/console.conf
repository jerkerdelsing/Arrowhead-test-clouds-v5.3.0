# generated by generator/generate.py. LocalCloudManager's HTTPS console, TCP pass-through (TLS ends in the manager).
# Only the host: a published port arrives from the gateway of this network (10.241.2.1).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8490;
    allow 10.241.2.1;
    allow 127.0.0.1;  # own health check
    deny all;
    set $u localcloudmanager:8490;
    proxy_pass $u;
    proxy_connect_timeout 5s;
    proxy_timeout 65s;
  }
}
