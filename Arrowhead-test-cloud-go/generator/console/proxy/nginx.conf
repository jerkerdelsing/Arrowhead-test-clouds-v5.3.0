# Console proxy of the Go test cloud v5.3.0 (2026-11-11). LocalCloudManager-go serves its console UI and API only with
# mutual TLS (port 8480); a browser has no client certificate. This proxy, published on the loopback interface only,
# forwards to it with its own client identity ConsoleProxy (security/bundles/console-proxy), verifying the server's
# certificate against the cloud CA and its name. The operator still logs in with the console password (scrypt hash in
# LocalCloudManager); the proxy adds no authentication of its own.
# J6: one canonical host name, so the console cookie is not shared with other consoles on 127.0.0.1/localhost.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;
  server {
    listen 8490;
    location = /proxy-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / {
      if ($host != "gocloud-v53.localhost") { return 308 http://gocloud-v53.localhost:7490$request_uri; }
      proxy_pass https://localcloudmanager:8480;
      proxy_ssl_certificate /certs/console-proxy.crt;
      proxy_ssl_certificate_key /certs/console-proxy.key;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_name localcloudmanager;
      proxy_ssl_server_name on;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}
