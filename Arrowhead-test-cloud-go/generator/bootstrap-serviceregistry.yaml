# Go test cloud v5.3.0 (2026-11-11): bootstrap of an empty ServiceRegistry snapshot (generator/deploy.sh only).
# With authentication.policy=outsourced the registry verifies identity tokens through Authentication's registered
# identity-verify operation; the primary Go Authentication registers itself with an identity token, so on an empty
# snapshot neither can start the other. For this one step the registry authenticates by client certificate (mTLS, CN):
# Authentication registers itself with its own certificate. No system's credentials are used by the operator. deploy.sh
# then recreates the registry from compose.yaml (outsourced, MQTT API on); the snapshot keeps the registration.
services:
  serviceregistry:
    environment:
      AUTHENTICATION_POLICY: certificate
      MQTT_API_ENABLED: "false"
