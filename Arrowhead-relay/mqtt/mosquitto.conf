# SPDX-License-Identifier: EPL-2.0
# Arrowhead v5.3.0 relay broker for the inter-cloud integration tests (see ../README.md).
# Mutual TLS only: a client must present a certificate that chains to security/trust.pem; its CN is the MQTT user name.
per_listener_settings false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 8883
protocol mqtt
cafile /certs/trust.pem
certfile /certs/relay.crt
keyfile /certs/relay.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
allow_anonymous false
# No acl_file: every authenticated client may publish and subscribe on every topic. The Gatekeeper and GateTunnel
# relay clients enforce sender identities themselves, and RelayRoundTripIT relies on an observer that reads and
# injects on all relay topics. A relay that carries real federation traffic needs the per-identity ACL instead.
