# Add this server block to the local cloud's private registry-bootstrap proxy.
# The surrounding nginx http context must configure the TLS certificate,
# client CA, ssl_verify_client and Docker resolver used by the other listeners.
server {
    listen 8508 ssl;
    location / {
        set $registry_upstream serviceregistry:8443;
        proxy_set_header Authorization "Bearer SYSTEM//GateTunnel";
        proxy_set_header Host serviceregistry:8443;
        proxy_pass http://$registry_upstream;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"serviceregistry"' '"registry-bootstrap-proxy"';
        sub_filter '"authentication-registry-mtls"' '"registry-bootstrap-proxy"';
        sub_filter '"accessPort":8443' '"accessPort":8508';
    }
}
